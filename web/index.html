<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #e8e2d6; font: 15px/1.35 Georgia, serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 1200 / 896; image-rendering: auto; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 14px; background: linear-gradient(transparent, #000a); font-size: 14px; pointer-events: none; display: flex; justify-content: space-between; }
  #bar .hint { opacity: 0.6; }
  :root { --paper: #f3e8cf; --paper-hi: #fbf4e2; --ink: #2b2118; --glow: #ffe7a8; --clay: #c9774a; }
  #inventory { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 #2b211840, 0 12px 28px #0006; transition: opacity .3s, left .3s, transform .3s; }
  #inventory[hidden] { display: none; }
  #inventory.quiet { opacity: .55; left: 24px; transform: none; }
  #inventory .bag { width: 46px; display: flex; justify-content: center; border-right: 2px dashed #2b211855; padding-right: 6px; }
  #inventory .slots { display: flex; gap: 8px; }
  #inventory .slot { width: 72px; height: 72px; padding: 0; display: grid; place-items: center; background: #e7d8b6; border: 2px solid #2b211866; border-radius: 14px; transition: transform .15s; }
  #inventory .slot:hover { transform: translateY(-4px); background: #efe1c0; border-color: var(--ink); }
  #inventory .slot.held { background: var(--glow); border: 3px solid var(--clay); box-shadow: 0 0 0 4px #ffd37a88; transform: translateY(-6px); }
  #inventory .slot.arriving img { visibility: hidden; }
  #inventory .slot img { width: 58px; height: 58px; object-fit: contain; filter: drop-shadow(0 2px 1px #2b211855); }
  #inventory .slot .name { color: var(--ink); font-size: 12px; text-align: center; padding: 4px; }
  .held-cursor { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5; display: flex; flex-direction: column; align-items: flex-start; }
  .held-cursor[hidden] { display: none; }
  .held-cursor img { width: 52px; height: 52px; object-fit: contain; margin: -10px 0 0 -10px; filter: drop-shadow(0 3px 2px #0007); }
  .held-cursor img[hidden] { display: none; }
  .held-cursor .label { margin: 2px 0 0 12px; padding: 4px 10px; background: #2b2118e8; color: var(--paper); border-radius: 9px; font-size: 15px; white-space: nowrap; }
  .flying { position: fixed; z-index: 6; pointer-events: none; object-fit: contain; }
  .toast { position: fixed; left: 50%; bottom: 136px; transform: translateX(-50%); padding: 6px 14px; background: #2b2118e8; color: var(--paper); border-radius: 10px; font-size: 17px; opacity: 0; pointer-events: none; }
  #talk { position: absolute; right: 24px; bottom: 48px; display: flex; flex-direction: column; gap: 8px; width: min(460px, 90vw); }
  #talk[hidden] { display: none; }
  #talk .who { display: flex; align-items: center; gap: 10px; }
  #talk .face { width: 52px; height: 52px; border-radius: 50%; background: #e9c46a; border: 2.5px solid var(--ink); overflow: hidden; }
  #talk .face img { width: 140%; margin: 0 0 0 -20%; display: block; }
  #talk .tag { padding: 2px 10px; background: #f3e8cfee; border: 2px solid var(--ink); border-radius: 9px; color: var(--ink); font-weight: bold; font-size: 15px; }
  #talk .answer { display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 #2b211840; font-size: 18px; transition: transform .12s; }
  #talk .answer:hover { background: var(--glow); border-color: var(--clay); transform: translateX(-6px); }
  #talk .key { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 7px; background: var(--paper-hi); font-size: 14px; }
  button { font: inherit; cursor: pointer; text-align: left; }
  #ending { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: #000c; padding: 24px; }
  #ending[hidden] { display: none; }
  #ending h1 { font-weight: normal; font-size: 40px; margin: 0 0 12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="view" width="1200" height="896"></canvas></div>
<div id="inventory" hidden></div>
<div id="talk" hidden></div>
<div id="ending" hidden></div>
<div id="bar"><span id="where"></span><span id="hover"></span><span class="hint">click to walk or use · right click to look or put back · g grid · m sound</span></div>
<script type="module" src="main.js"></script>
</body>
</html>
