<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #e8e2d6; font: 15px/1.35 Georgia, serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 1200 / 896; image-rendering: auto; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 14px; background: linear-gradient(transparent, #000a); font-size: 14px; pointer-events: none; display: flex; justify-content: space-between; }
  #bar .hint { opacity: 0.6; }
</style>
</head>
<body>
<div id="stage"><canvas id="view" width="1200" height="896"></canvas></div>
<div id="bar"><span id="where"></span><span id="hover"></span><span class="hint">click to walk · g grid</span></div>
<script type="module" src="/main.js"></script>
</body>
</html>
