name: Publish to npm

# Push a tag such as v0.1.1 (from `npm version patch`) to publish that version as @gtanczyk/diorama.
# Uses npm trusted publishing (OIDC), no token: the package's npm settings name this repo, this file and the npm environment.
on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs `npm run typecheck`. npm adds provenance by itself once the repo is public.
      - run: npm publish --access public --tag latest
